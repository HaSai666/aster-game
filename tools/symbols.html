<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>金龙聚宝 · 图标检视</title>
  <style>
    body { margin:0; padding:28px; background:#1a0607; color:#f6e7cf;
           font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    h1 { font:700 18px/1 "Noto Serif SC","Songti SC",serif; letter-spacing:.2em; color:#e8b640; margin:0 0 20px; }
    .row { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
    .cell { text-align:center; }
    .cell canvas { display:block; border-radius:14px; }
    .cell span { display:block; margin-top:6px; font-size:12px; color:#b0947a; }
    .small canvas { border-radius:8px; }
  </style>
</head>
<body>
  <h1>图标检视 · 大图（含底板）</h1>
  <div class="row" id="big"></div>
  <h1>实际盘面尺寸（约 124×104）</h1>
  <div class="row small" id="real"></div>
  <h1>缩到 56px —— 剪影辨识度测试</h1>
  <div class="row small" id="tiny"></div>

  <script src="../js/config.js"></script>
  <script src="../js/art.js"></script>
  <script>
    var C = window.ASTER_CONFIG, ART = window.ASTER_ART;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    function sheet(hostId, w, h, label) {
      var host = document.getElementById(hostId);
      Object.keys(C.SYMBOLS).forEach(function (key) {
        var sym = C.SYMBOLS[key];
        var wrap = document.createElement("div");
        wrap.className = "cell";
        var cv = document.createElement("canvas");
        cv.width = w * dpr; cv.height = h * dpr;
        cv.style.width = w + "px"; cv.style.height = h + "px";
        var ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        var special = key === "W" ? "wild" : key === "S" ? "scatter" : key === "C" ? "coin" : null;
        ART.drawPlate(ctx, w, h, { special: special });
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ART.drawSymbol(ctx, key, sym, Math.min(w, h) * 0.82);
        ctx.restore();
        wrap.appendChild(cv);
        if (label) { var s = document.createElement("span"); s.textContent = sym.name; wrap.appendChild(s); }
        host.appendChild(wrap);
      });
    }
    sheet("big", 190, 160, true);
    sheet("real", 124, 104, false);
    sheet("tiny", 56, 56, false);
  </script>
</body>
</html>
